packages:
  - "app/*"
  - "app/server/control-plane"
  - "lp"
  - "packages/*"
  - "scripts/docs/notion-sync"

# Vite+ catalog: vite / vitest を Vite+ バンドル版に固定し、ワークスペース全体で共有する
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: 0.3.0

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# @hookform/resolvers/zod imports zod but the package does not declare it as a peer.
# Declare the missing edge so pnpm's strict linker connects the Web-owned dependency.
packageExtensions:
  "@hookform/resolvers@*":
    peerDependencies:
      zod: ">=3.25.0"

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260718.1'
