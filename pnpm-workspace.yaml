packages:
  - "app/*"
  - "lp"
  - "packages/*"
  - "scripts/docs/notion-sync"

# Vite+ catalog: vite / vitest を Vite+ バンドル版に固定し、ワークスペース全体で共有する
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: 0.2.5

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260718.1'
