packages:
  - "app/*"
  - "lp"
  - "packages/*"
  - "scripts/docs/notion-sync"

# Vite+ catalog: vite / vitest を Vite+ バンドル版に固定し、ワークスペース全体で共有する
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
