name: Realtime E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: realtime / synchronization and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Fixed Browser
        run: nix develop --command scripts/dev/install-presentation-browser.sh

      - name: Verify declared Audience development CLI
        run: nix develop --command pnpm --filter @unframe/audience exec vp --version

      - name: Allow Fixed Browser user namespace
        run: bash scripts/ci/allow-presentation-browser-userns.sh

      - name: Prepare isolated Opaque capture host
        run: nix develop --command bash scripts/ci/setup-opaque-host.sh

      - name: Mixed transport synchronization and recovery
        run: nix run .#realtime-e2e -- --race

      - name: Upload non-secret process diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: realtime-e2e-process-diagnostics
          path: .unframe/realtime-e2e/runs/*/diagnostics.jsonl
          include-hidden-files: true
          if-no-files-found: ignore

  unity-live:
    name: realtime / Unity and Audience synchronization and recovery
    if: >-
      vars.UNITY_E2E_RUNNER != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == vars.UNITY_E2E_BRANCH
    runs-on: [self-hosted, "${{ vars.UNITY_E2E_RUNNER }}"]
    timeout-minutes: 45
    env:
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR_PATH }}
    steps:
      - uses: actions/checkout@v7

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Fixed Browser
        run: nix develop --command scripts/dev/install-presentation-browser.sh

      - name: Verify declared Audience development CLI
        run: nix develop --command pnpm --filter @unframe/audience exec vp --version

      - name: Prepare isolated Opaque capture host
        run: nix develop --command bash scripts/ci/setup-opaque-host.sh

      - name: Real Unity and Audience synchronization and recovery
        run: nix run .#realtime-e2e -- --unity --race

      - name: Upload non-secret process diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: realtime-e2e-unity-process-diagnostics
          path: .unframe/realtime-e2e/runs/*/diagnostics.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
