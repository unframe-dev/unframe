name: CI

# オーケストレーション。変更のあった領域だけ reusable workflow を呼び、
# 最後に集約ゲート (job: ci) を必須チェックにする。
# 各領域の実体: control-plane.yml / realtime.yml / web.yml / lp.yml / unity.yml。
#
# paths-ignore は設けない。docs-only PR でも workflow を起動し、changes で全領域が
# skip → 集約 job `CI` が成功することで、必須ステータスチェックが常に報告される。
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch used to detect changed areas
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR では後続 push で古い実行を打ち切る。main では各コミットを確実に検証するため打ち切らない。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # dorny/paths-filter が PR の変更ファイル取得に PR API を使う場合に必要。
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # draft PR ではスキップ (ready にした時点で ready_for_review により実行される)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      control-plane: ${{ steps.filter.outputs.control-plane }}
      realtime: ${{ steps.filter.outputs.realtime }}
      web: ${{ steps.filter.outputs.web }}
      lp: ${{ steps.filter.outputs.lp }}
      unity: ${{ steps.filter.outputs.unity }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # workflow_dispatch は PR イベント情報を持たないため、Autofix から渡した base を使う。
          # PR では従来どおり PR API、main への push では直前 commit と比較する。
          base: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
          filters: |
            shared: &shared
              - 'flake.nix'
              - 'flake.lock'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'packages/config/**'
              - 'vite.config.ts'
              - '.github/workflows/ci.yml'
            control-plane:
              - *shared
              - '.github/workflows/control-plane.yml'
              - 'app/server/control-plane/**'
              - 'packages/contracts/**'
              - 'packages/api-client-typescript/**'
            realtime:
              - *shared
              - '.github/workflows/realtime.yml'
              - 'app/server/realtime/**'
              - 'packages/contracts/proto/**'
            web:
              - *shared
              - '.github/workflows/web.yml'
              - 'app/web/**'
              - 'packages/api-client-typescript/**'
            lp:
              - *shared
              - '.github/workflows/lp.yml'
              - 'lp/**'
            unity:
              - '.github/workflows/unity.yml'
              - 'app/unity/**'

  control-plane:
    name: Control Plane
    needs: changes
    if: needs.changes.outputs.control-plane == 'true'
    uses: ./.github/workflows/control-plane.yml

  realtime:
    name: Realtime
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    uses: ./.github/workflows/realtime.yml

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  lp:
    name: LP
    needs: changes
    if: needs.changes.outputs.lp == 'true'
    uses: ./.github/workflows/lp.yml

  unity:
    name: Unity
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    uses: ./.github/workflows/unity.yml

  ci:
    name: CI
    # 必須ステータスチェック。全領域の結果を集約する。
    needs: [changes, control-plane, realtime, web, lp, unity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
          echo "All required jobs succeeded or were skipped."
