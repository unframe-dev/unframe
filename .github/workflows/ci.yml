name: CI

# オーケストレーション。変更のあった領域だけ reusable workflow を呼び、
# 最後に集約ゲート (job: ci) を必須チェックにする。
# 各領域の実体: server.yml / web.yml / lp.yml / openapi.yml / unity.yml。
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/notion/**"
      - "docs/decisions/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/notion/**"
      - "docs/decisions/**"
      - "**.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR では後続 push で古い実行を打ち切る。main では各コミットを確実に検証するため打ち切らない。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # draft PR ではスキップ (ready にした時点で ready_for_review により実行される)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      lp: ${{ steps.filter.outputs.lp }}
      openapi: ${{ steps.filter.outputs.openapi }}
      unity: ${{ steps.filter.outputs.unity }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'flake.nix'
              - 'flake.lock'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            server:
              - *shared
              - '.github/workflows/server.yml'
              - 'app/backend/**'
            openapi:
              - *shared
              - '.github/workflows/openapi.yml'
              - 'app/backend/**'
              - 'packages/contracts/**'
              - 'packages/api-client-ts/**'
              - 'packages/api-client-csharp/**'
            web:
              - *shared
              - '.github/workflows/web.yml'
              - 'app/web/**'
              - 'packages/api-client-ts/**'
              - 'packages/contracts/**'
            lp:
              - *shared
              - '.github/workflows/lp.yml'
              - 'lp/**'
            unity:
              - '.github/workflows/unity.yml'
              - 'app/unity/**'

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server.yml

  openapi:
    name: OpenAPI
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    uses: ./.github/workflows/openapi.yml

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  lp:
    name: LP
    needs: changes
    if: needs.changes.outputs.lp == 'true'
    uses: ./.github/workflows/lp.yml

  unity:
    name: Unity
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    uses: ./.github/workflows/unity.yml

  ci:
    name: CI
    # 必須ステータスチェック。全領域の結果を集約する。
    needs: [changes, server, openapi, web, lp, unity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
          echo "All required jobs succeeded or were skipped."
