name: Presentation Packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: presentation / check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Fixed Browser
        run: nix develop --command scripts/dev/install-presentation-browser.sh

      - name: Allow Fixed Browser user namespace
        run: bash scripts/ci/allow-presentation-browser-userns.sh

      - name: shared config / typecheck / lint / test
        run: nix run .#presentation

      - name: Prepare isolated Opaque capture host
        run: nix develop --command bash scripts/ci/setup-opaque-host.sh

      - name: Opaque capture and React CLI acceptance
        run: nix develop --command scripts/ci/opaque-capture.sh
