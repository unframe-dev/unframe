name: LP

# lp (SvelteKit SSG ランディングページ) の品質ゲート。ci.yml から呼ばれる reusable workflow。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lp / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main
      - uses: DeterminateSystems/magic-nix-cache-action@2cdbb78a6eed25b3bc8b97f863549be5f6567e55 # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: check / test / build
        run: nix run .#lp
