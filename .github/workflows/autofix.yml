name: Autofix

# PR ブランチに format / lint --fix を適用し、変更を commit して push する単一の書き込み job。
# 領域別の修正コマンドは scripts/ci/<area>.sh の fix モードに同居する。
# commit を 1 job に集約するのは、並列 job が同一ブランチへ push すると競合するため。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  autofix:
    name: autofix / format + lint --fix
    # 同一リポジトリの PR のみ (fork は head ブランチへ push 権限が無い)。
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # PR head を checkout するが認証情報は残さない (persist-credentials: false)。
      # fixer は PR 由来のスクリプト (scripts/ci/*.sh) を実行するため、トークンや push 権限を
      # この段階で環境に置かない。push は最終ステップでのみトークンを使う。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      # 依存の lifecycle script は実行しない (トークン非公開でも供給元コードの実行を避ける)。
      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply autofix (control-plane / lp / web)
        run: |
          nix run .#control-plane -- fix
          nix run .#lp -- fix
          nix run .#web -- fix

      # トークンはここ (PR 制御コードの実行後) でのみ環境に入れる。
      # GitHub App token または PAT を使い、fix commit 後の CI を必ず再トリガーする。
      # GITHUB_TOKEN に fallback すると bot push の workflow が実行されず、未検証の
      # head が残るため、変更がある場合は AUTOFIX_TOKEN を必須とする。
      - name: Commit and push fixes
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし"
            exit 0
          fi
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Autofixで変更が発生しましたが、AUTOFIX_TOKENが設定されていません。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: 自動整形と lint 修正を適用"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${HEAD_REF}"
