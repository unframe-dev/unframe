name: Sync Notion

on:
  schedule:
    # 12時間ごと (JST 09:00 / 21:00)
    - cron: "0 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (workspace root)
        run: pnpm install --frozen-lockfile

      - name: Sync Notion → docs/notion/
        working-directory: tools/notion-sync
        run: pnpm sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}

      - name: Format synced Markdown
        run: pnpm exec vp check --fix docs/notion/

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'docs/notion/'
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(notion): sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
