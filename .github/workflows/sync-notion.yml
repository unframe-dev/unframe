name: Sync Notion

on:
  schedule:
    # 12時間ごと (JST 09:00 / 21:00)
    - cron: "0 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ツールチェインは flake.nix が固定する (ADR-0004)。
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: Install dependencies (workspace root)
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Sync Notion → docs/notion/
        run: nix run .#notion-sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}

      - name: Format synced Markdown
        run: nix develop --command pnpm exec vp check --fix docs/notion/

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'docs/notion/'
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "🔧 notion: sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
