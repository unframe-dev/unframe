name: Realtime

# app/server/realtime の Go gRPC backend を検証する reusable workflow。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: realtime / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: Cache Realtime Go build and module downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-realtime-go-${{ hashFiles('app/server/realtime/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-realtime-go-

      - name: vet / lint / test / build / race
        run: nix run .#realtime

      - name: Build container image
        run: docker build app/server/realtime
