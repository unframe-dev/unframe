name: Realtime

# app/server/realtime の Go gRPC backend を検証する reusable workflow。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: realtime / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@e0ea8f6061c766e5c1d927cea8be769a1c5108a9 # v36
      - uses: DeterminateSystems/magic-nix-cache-action@8941f279e15828abcd2fc8fbb7cd282ab00972a7 # main

      - name: Cache Realtime Go build and module downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-realtime-go-${{ hashFiles('app/server/realtime/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-realtime-go-

      - name: vet / lint / test / build / race
        run: nix run .#realtime

      - name: Build container image
        run: docker build app/server/realtime
