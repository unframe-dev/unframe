name: Realtime

# app/server/realtime の Go gRPC backend を検証する reusable workflow。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: realtime / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main
      - uses: DeterminateSystems/magic-nix-cache-action@2cdbb78a6eed25b3bc8b97f863549be5f6567e55 # main

      - name: Cache Realtime Go build and module downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-realtime-go-${{ hashFiles('app/server/realtime/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-realtime-go-

      - name: vet / lint / test / build / race
        run: nix run .#realtime

      - name: Build container image
        run: docker build app/server/realtime
