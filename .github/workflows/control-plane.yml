name: Control Plane

# Cloudflare Workers / Hono Control Plane の品質ゲート。ci.yml から呼ばれる reusable workflow。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: control-plane / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: typecheck / test / deploy dry-run
        run: nix run .#control-plane
