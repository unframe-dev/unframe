name: Local Editor

# app/local-editor (local Source editor) の品質ゲート。ci.yml から呼ばれる reusable workflow。
# Node ロジックテストと型検査・build を実行する。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: local-editor / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: check / test / build
        run: nix run .#local-editor
