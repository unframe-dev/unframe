name: Web

# app/web (React 動的編集エディタ) の品質ゲート。ci.yml から呼ばれる reusable workflow。
# unit/build gate と Playwright E2E を分けて実行する。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: web / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: DeterminateSystems/magic-nix-cache-action@2cdbb78a6eed25b3bc8b97f863549be5f6567e55 # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: nix develop --command pnpm --filter @unframe/web exec playwright install --with-deps chromium

      - name: check / test / build
        run: nix run .#web

      - name: Playwright E2E
        run: nix develop --command pnpm --filter @unframe/web run test:e2e
