name: Web

# app/web (React 動的編集エディタ) の品質ゲート。ci.yml から呼ばれる reusable workflow。
# unit/build gate と Playwright E2E を分けて実行する。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: web / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: nix develop --command pnpm --filter @unframe/web exec playwright install --with-deps chromium

      - name: check / test / build
        run: nix run .#web

      - name: Playwright E2E
        run: nix develop --command pnpm --filter @unframe/web run test:e2e
