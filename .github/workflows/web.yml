name: Web

# app/web (React 動的編集エディタ) の品質ゲート。ci.yml から呼ばれる reusable workflow。
# 現行は app/web 未実装のため check-web はスキップする (ADR-0004 follow-up)。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: web / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: check / test / build
        run: nix run .#check-web
