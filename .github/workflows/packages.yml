name: Packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.suite }}, ubuntu-latest)
    strategy:
      fail-fast: false
      matrix:
        suite: [contracts, core, usecases, adapters, cli, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Fixed Browser
        if: matrix.suite == 'acceptance'
        run: nix develop --command scripts/dev/install-presentation-browser.sh

      - name: Allow Fixed Browser user namespace
        if: matrix.suite == 'acceptance'
        run: bash scripts/ci/allow-presentation-browser-userns.sh

      - name: Presentation quality suite
        run: nix run .#presentation -- "${{ matrix.suite }}"

  opaque-capture:
    name: opaque-capture (${{ matrix.suite }}, ubuntu-latest)
    strategy:
      fail-fast: false
      matrix:
        suite: [renderer, cli-project, cli-author, cli-styles]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Fixed Browser
        run: nix develop --command scripts/dev/install-presentation-browser.sh

      - name: Allow Fixed Browser user namespace
        run: bash scripts/ci/allow-presentation-browser-userns.sh

      - name: Prepare isolated Opaque capture host
        run: nix develop --command bash scripts/ci/setup-opaque-host.sh

      - name: Opaque capture and React CLI acceptance
        run: nix develop --command scripts/ci/opaque-capture.sh "${{ matrix.suite }}"

  macos:
    name: platform (macos-26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Install JS dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Fixed Browser
        run: nix develop --command scripts/dev/install-presentation-browser.sh

      - name: Native filesystem, worker isolation and Browser smoke tests
        run: nix develop --command scripts/ci/opaque-capture.sh macos
