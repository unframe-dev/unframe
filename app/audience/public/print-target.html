<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Unframe AprilTag</title>
    <style>
      body {
        margin: 24px;
        font-family: system-ui, sans-serif;
        background: #24282b;
        color: #edf6f2;
      }
      header {
        max-width: 800px;
        margin: 0 auto 24px;
        line-height: 1.8;
      }
      a {
        color: inherit;
      }
      img {
        display: block;
        width: 150mm;
        height: 150mm;
        max-width: none;
        margin: auto;
      }
      img[hidden] {
        display: none;
      }
      button,
      select {
        font: inherit;
        padding: 8px;
      }
      @page {
        margin: 0;
      }
      @media print {
        header {
          display: none;
        }
        body {
          margin: 0;
          background: white;
        }
        img {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>AprilTag · 位置合わせPoC</h1>
      <form method="get">
        <label
          >設置外寸（白い余白込み）
          <select name="size" id="size">
            <option value="22.5">22.5cm四方（黒い外周15cm）</option>
            <option value="36">36cm四方（黒い外周24cm）</option>
            <option value="50">50cm四方</option>
            <option value="60">60cm四方</option>
            <option value="70">70cm四方</option>
          </select>
        </label>
        <button type="submit">表示を切り替え</button>
      </form>
      <p id="name"></p>
      <div id="instructions"></div>
      <button onclick="window.print()">印刷</button> <a id="back" href="/">PoCへ戻る</a>
    </header>
    <img id="board" hidden alt="専用マーカー" />
    <script>
      const query = new URLSearchParams(location.search);
      const size = query.get("size") ?? "22.5";
      const board = document.getElementById("board");
      const sizeControl = document.getElementById("size");
      if (query.getAll("size").length > 1 || !["22.5", "36", "50", "60", "70"].includes(size)) {
        board.hidden = true;
        document.getElementById("name").textContent = "不明なサイズです。選び直してください。";
      } else {
        board.hidden = false;
        sizeControl.value = size;
        const outerCm = Number(size);
        const blackCm = (outerCm * 2) / 3;
        board.src = `/markers/april-single-${size}.svg`;
        board.style.width = `${outerCm * 10}mm`;
        board.style.height = `${outerCm * 10}mm`;
        board.alt = `余白込み外寸${outerCm}cm、黒い外周${blackCm.toFixed(2)}cmの単一ID0マーカー`;
        const family = "AprilTag tag36h11";
        document.getElementById("name").textContent = `${family} · ID 0`;
        const descriptions = [
          `白い余白込みの設置外寸は${outerCm}×${outerCm}cm、黒い外周の一辺は${blackCm.toFixed(2)}cm（外寸の2/3）です。周囲の白い余白も残してください。位置計算には外寸ではなく黒い外周の寸法を使います。`,
          "出力で倍率100%を指定し、設置外寸と黒い外周の実幅を定規で測定してください。A4に合わせて縮小印刷すると寸法が変わり、位置計算が不正確になります。分割印刷では継ぎ目と平面性も確認してください。画面表示のCSS寸法も実寸の保証にはなりません。",
          "タグの姿勢が取得できたら位置を即更新し、次の更新まではSDK／SLAMで保持します。タグが未検出・姿勢が曖昧な間は直前の位置を保持します。SDK追跡が低下した場合は非表示にし、新しいタグ認識を待ちます。",
        ];
        const instructions = document.getElementById("instructions");
        for (const text of descriptions) {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          instructions.append(paragraph);
        }
        document.getElementById("back").href = `/?size=${size}`;
      }
    </script>
  </body>
</html>
