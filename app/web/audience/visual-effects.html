<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Effects Preview</title>
  </head>
  <body>
    <main>
      <h1>演出プレビュー</h1>
      <label
        >サイズ <input id="size" type="range" min="0.25" max="2" step="0.05" value="1"
      /></label>
      <label>色 <input id="color" type="color" value="#ffffff" /></label>
      <label>速度 <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1" /></label>
      <button id="wave">ウェーブ</button><button id="dissolve">モデルを消す</button>
      <button id="hand">手元の光を開始</button><button id="end">手元の光を終了</button>
      <button id="reset">リセット</button><button id="pause">一時停止</button>
      <p id="status" role="status">演出を選択してください</p>
    </main>
    <canvas id="preview"></canvas>
    <script type="module" src="/src/visual-effects/preview.ts"></script>
  </body>
</html>
