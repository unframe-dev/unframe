<!doctype html>
<meta charset="utf-8" />
<title>Verified bytes → Unity VideoPlayer spike</title>
<button id="play">Play (user activation)</button><button id="dispose">Dispose</button>
<canvas id="unity" width="640" height="360"></canvas>
<pre id="status"></pre>
<script>
  window.spikeEvents = [];
  window.mediaElements = [];
  window.playResults = [];
  const create = document.createElement.bind(document);
  document.createElement = function (name, options) {
    const element = create(name, options);
    if (name.toLowerCase() === "video") mediaElements.push(element);
    return element;
  };
  const originalPlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () {
    const result = originalPlay.apply(this, arguments);
    if (result)
      result.then(
        () => playResults.push("resolved"),
        (e) => playResults.push(e.name),
      );
    return result;
  };
  let objectUrl;
  let unity;
  window.loadVerified = async function (overrides = {}, variant = "") {
    const identity = { ...(await (await fetch("/identity.json" + variant)).json()), ...overrides };
    const response = await fetch("/asset.mp4" + variant, {
      headers: { Authorization: "Bearer local-spike-fixture" },
    });
    if (!response.ok) throw Error("http " + response.status);
    const bytes = await response.arrayBuffer();
    if (bytes.byteLength !== identity.size) throw Error("size mismatch");
    const sha256 = [...new Uint8Array(await crypto.subtle.digest("SHA-256", bytes))]
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
    if (sha256 !== identity.sha256) throw Error("checksum mismatch");
    objectUrl = URL.createObjectURL(new Blob([bytes], { type: "video/mp4" }));
    window.currentObjectUrl = objectUrl;
    spikeEvents.push({ kind: "verified", size: bytes.byteLength, sha256 });
    unity.SendMessage("VideoSpike", "Load", objectUrl);
  };
  window.command = (name, value = "") => unity.SendMessage("VideoSpike", name, value);
  document.querySelector("#play").onclick = () => {
    window.audioEvidence = [];
    window.audioContext ??= new AudioContext();
    audioContext.resume();
    for (const video of mediaElements) {
      if (video.spikeAnalyser) continue;
      const source = audioContext.createMediaElementSource(video);
      const analyser = audioContext.createAnalyser();
      source.connect(analyser);
      analyser.connect(audioContext.destination);
      video.spikeAnalyser = analyser;
      const data = new Float32Array(analyser.fftSize);
      const sample = () => {
        analyser.getFloatTimeDomainData(data);
        audioEvidence.push(Math.sqrt(data.reduce((sum, x) => sum + x * x, 0) / data.length));
        if (audioEvidence.length < 100) requestAnimationFrame(sample);
      };
      requestAnimationFrame(sample);
    }
    command("Play");
  };
  document.querySelector("#dispose").onclick = async () => {
    command("Dispose");
    URL.revokeObjectURL(objectUrl);
    try {
      await fetch(objectUrl);
      spikeEvents.push({ kind: "revokeFailed" });
    } catch {
      spikeEvents.push({ kind: "revoked" });
    }
  };
  const loader = create("script");
  loader.src = "/player/Build/player.loader.js";
  loader.onload = async () => {
    unity = await createUnityInstance(document.querySelector("#unity"), {
      dataUrl: "/player/Build/player.data",
      frameworkUrl: "/player/Build/player.framework.js",
      codeUrl: "/player/Build/player.wasm",
      streamingAssetsUrl: "/player/StreamingAssets",
      companyName: "Unframe",
      productName: "VideoSpike",
      productVersion: "1",
      showBanner: (msg, type) => spikeEvents.push({ kind: type, detail: msg }),
    });
    window.unityInstance = unity;
  };
  document.head.append(loader);
</script>
